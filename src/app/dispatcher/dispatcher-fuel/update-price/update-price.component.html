



<div class="mat-elevation-z3 mat-table-container">
  <div style="display:flex; justify-content:space-between">
    <h6 mat-hedear>Fuel price's</h6>
    <mat-form-field>
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="searchQuery" (keyup)="search()" placeholder="Ex. Plate No" />
    </mat-form-field>
  </div>
  <table mat-table [dataSource]=dataSource class="responsive-table" matSort>
    <ng-container matColumnDef="typeOfFuel">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Fuel Type </th>
      <td mat-cell *matCellDef="let data"> {{data?.typeOfFuel}} </td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Price </th>
      <td mat-cell *matCellDef="let data"> {{data?.price}} </td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let vehicle">
        <button mat-button (click)="update(vehicle)">update</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
</div>



<ng-template #dialogTemplate let-data>
  <h6 mat-dialog-title> Update Fuel Price</h6>
  <mat-dialog-content>
    <form [formGroup]="form" (ngSubmit)="updatePrice()">
      <input type="hidden" name="id" class="form-control" id="id" />
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="typeOfFuel">Fuel Type</label>
          <input formControlName="typeOfFuel" id="typeOfFuel" class="form-control" readonly />
        </div>
        <div class="form-group col-md-6">
          <label for="price">Price</label>
          <input type="text" formControlName="price" class="form-control" id="price" [ngClass]="{
              'is-invalid': submitted && f['price'].errors
            }" />
          <div *ngIf="submitted && f['price'].errors" class="invalid-feedback">
            <div *ngIf="f['price'].errors?.['pattern']">
              Please insert a valid number
            </div>
          </div>
        </div>
      </div>
      <mat-dialog-actions>
        <button mat-button type="submit"> Update
        </button>
        <button mat-button (click)="onClose()" type="button">Close</button>
      </mat-dialog-actions>
    </form>
  </mat-dialog-content>
</ng-template>
