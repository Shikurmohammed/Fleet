<div class="sidenav-header">
  <div class="sidenav-header-title" [class.hide-sidenav-header-text]="!isOpen">
    <h6> Welcome {{userName}}, </h6>
    <i>{{currentRole}}!</i>

  </div>
</div>
<mat-nav-list class="transition-all duration-300" *ngFor="let item of menuItems; let i=index">
  <app-menu-item [item]="item" [index]="i" [nestedMenuOpen]="nestedMenuOpen$" (toggle)="toggleNestedMenu(i)"
    [isOpen]="isOpen"></app-menu-item>
</mat-nav-list>
