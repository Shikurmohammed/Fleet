<ng-container *ngIf="!isAuthenticated(); else authenticatedContent">
  <app-auth></app-auth>
</ng-container>

<ng-template #authenticatedContent>

  <ng-container *ngIf="isNewUser; else mainContent">
    <app-changepassword></app-changepassword>
  </ng-container>

  <ng-template #mainContent>
    <mat-toolbar class="mat-elevation-z13">
      <div class="toolbar-content">
        <div class="toolbar-left">
          <button class="toggle-sidenav" mat-icon-button (click)="toggleSidebar()">
            <mat-icon>menu</mat-icon>
            <!-- <mat-icon>{{!isOpen?'menu_open':'menu_close'}}</mat-icon> -->
          </button>
          <span>
            <img src="assets/img/AB1.png" alt="logo" style="width:30px; height:30px; margin-right:10px;" />
          </span>
          <span>Awash Fleet!</span>
        </div>
        <div class="toolbar-right">
          <i class="current-date" style="font-size: 12px;">{{ currentDate | date:'dd-MMM-YY,HH:mm:ss' }}</i>
          <button mat-icon-button matBadge="0">
            <mat-icon>notifications</mat-icon>
          </button>
          <button mat-icon-button [matMenuTriggerFor]="profilemenu">
            <!-- <mat-icon>account_circle</mat-icon> -->
            <img src="assets/img/user.png" alt="logo" [width]="30" [height]="30" />

          </button>
          <mat-menu #profilemenu="matMenu">
            <a mat-menu-item routerLink="/changePassword" class="menu-item">
              <mat-icon>lock</mat-icon>
              Change Password
            </a>
            <a mat-menu-item [href]="userguide!" target="_blank" class="menu-item">
              <mat-icon>help</mat-icon>
              Help
            </a>
            <button mat-menu-item (click)="logout()" class="menu-item">
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </div>
      </div>
    </mat-toolbar>

    <mat-sidenav-container>
      <mat-sidenav #sidenav opened mode="side" [style.width]="isOpen ? '260px' : '80px'" class="custom-sidenav">
        <app-sidebar [isOpen]="isOpen"></app-sidebar>
      </mat-sidenav>
      <mat-sidenav-content class="content" [style.marginLeft]="isOpen ? '260px' : '80px'">
        <router-outlet>
          <ngx-ui-loader></ngx-ui-loader>
        </router-outlet>
        <!-- <app-footer [isOpen]="isOpen"></app-footer> -->
      </mat-sidenav-content>
    </mat-sidenav-container>
  </ng-template>
</ng-template>
