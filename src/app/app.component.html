<ng-container *ngIf="!isAuthenticated(); else authenticatedContent">
    <app-auth></app-auth>
</ng-container>

<ng-template #authenticatedContent>

    <ng-container *ngIf="isNewUser; else mainContent">
        <app-changepassword></app-changepassword>
    </ng-container>

    <ng-template #mainContent>
        <mat-toolbar class="mat-elevation-z13">
            <div class="toolbar-content">
                <div>
                    <button mat-icon-button (click)="toggleSidebar()">
                        <mat-icon>menu</mat-icon>
                    </button>
                    <span>Awash Fleet!</span>

                </div>
                <div style="display: flex; align-items: center; justify-content: flex-end; padding: 10px;">
                    <i style="font-size: 12px; margin-right: 10px;"> {{currentDate | date:'dd-MMM-YY,HH:mm:ss' }}</i>
                    <button mat-icon-button matBadge="0">
                        <mat-icon>notifications</mat-icon>
                    </button>

                    <!-- <button mat-button (click)="toggleDarkMode()">
        <mat-icon>{{ isDarkModeEnabled() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button> -->
                    <button mat-icon-button [matMenuTriggerFor]="profilemenu">
                        <mat-icon>account_circle</mat-icon>
                    </button>
                    <mat-menu style=" background-color: red;" #profilemenu="matMenu">
                        <a mat-menu-item routerLink="/changePassword" style="color:black">
                            <mat-icon>lock</mat-icon>
                            Change Password
                        </a>
                        <a mat-menu-item [href]="userguide!" target="_blank" style="color:black">
                            <mat-icon>help</mat-icon>
                            Help
                        </a>
                        <button mat-menu-item (click)="logout()" style="color:black">
                            <mat-icon>logout</mat-icon>
                            <span>Logout</span>
                        </button>
                    </mat-menu>
                </div>
            </div>
        </mat-toolbar>
        <mat-sidenav-container>
            <mat-sidenav #sidenav opened mode="side" [style.width]="isOpen ? '260px' : '70px'" class="custom-sidenav">
                <app-sidebar [isOpen]="isOpen"></app-sidebar>
            </mat-sidenav>
            <mat-sidenav-content class="content" [style.marginLeft]="isOpen ? '260px' : '70px'">
                <div class="main-content">
                    <router-outlet>
                        <ngx-ui-loader></ngx-ui-loader>
                    </router-outlet>
                </div>
                <app-footer [isOpen]="isOpen"></app-footer>

            </mat-sidenav-content>
        </mat-sidenav-container>
    </ng-template>
</ng-template>
